<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="./assets/css/style.css" />
</head>

<body>
  <h3 class="text-center bg-warning p-2">1st todo with firebase and xhr as well as fetch(for PATCH request)</h3>
  <div class="container">
    <div class="row mt-4 mb-4">
      <div class="col-md-5  mb-4">
        <div class="card">
          <div class="card-header">
            <h1>Add Your Todos</h1>
          </div>
          <div class="card-body">
            <form id="todoForm">
              <div class="form-group">
                <label for="todoItem">Todo Item</label>
                <input required type="text" class="form-control" id="todoItem">
              </div>
              <button class="btn btn-sm btn-info btn-block" id="addTodoBtn">Add Todo</button>
              <button  type="button" class="btn btn-sm btn-info btn-block d-none" id="udpateTodoBtn">Update Todo</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-7">
        <div class="card">
          <div class="card-header text-center">
            <h1>Your Todos</h1>
          </div>
          <div class="card-body">
            <ul class="list-group" id="todoContainer">
              <!-- <li class="list-group-item d-flex justify-content-between">
                <strong>Html</strong>
                <div>
                  <button class="btn btn-sm btn-info">Edit</button>
                  <button class="btn btn-sm btn-danger ml-2">Delete</button>
                </div>
              </li> -->
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="spinner" class="d-none">

    <div class="spinner-border" role="status">
      <span class="sr-only">Loading...</span>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./assets/js/app.js"></script>
</body>

</html>
